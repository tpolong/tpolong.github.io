<div id="map" class="container"></div>

<script type="module">
  import { Coordinate, Map, TileLayer } from "maptalks";
  import { GeoJSONVectorTileLayer, GroupGLLayer } from "gl-layers";

  // GCJ-02 → WGS-84（中国火星坐标转标准经纬度），替代旧版 maptalks.CRSTransform
  const _CRS_PI = Math.PI;
  const _CRS_A = 6378245.0;
  const _CRS_EE = 0.00669342162296594323;
  function _crsLat(x, y) {
    let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    ret += (20.0 * Math.sin(6.0 * x * _CRS_PI) + 20.0 * Math.sin(2.0 * x * _CRS_PI)) * 2.0 / 3.0;
    ret += (20.0 * Math.sin(y * _CRS_PI) + 40.0 * Math.sin(y / 3.0 * _CRS_PI)) * 2.0 / 3.0;
    ret += (160.0 * Math.sin(y / 12.0 * _CRS_PI) + 320 * Math.sin(y * _CRS_PI / 30.0)) * 2.0 / 3.0;
    return ret;
  }
  function _crsLon(x, y) {
    let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    ret += (20.0 * Math.sin(6.0 * x * _CRS_PI) + 20.0 * Math.sin(2.0 * x * _CRS_PI)) * 2.0 / 3.0;
    ret += (20.0 * Math.sin(x * _CRS_PI) + 40.0 * Math.sin(x / 3.0 * _CRS_PI)) * 2.0 / 3.0;
    ret += (150.0 * Math.sin(x / 12.0 * _CRS_PI) + 300.0 * Math.sin(x / 30.0 * _CRS_PI)) * 2.0 / 3.0;
    return ret;
  }
  function _crsDelta(lat, lon) {
    const dLat = _crsLat(lon - 105.0, lat - 35.0);
    const dLon = _crsLon(lon - 105.0, lat - 35.0);
    const radLat = (lat / 180.0) * _CRS_PI;
    let magic = Math.sin(radLat);
    magic = 1 - _CRS_EE * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    return {
      lat: (dLat * 180.0) / ((_CRS_A * (1 - _CRS_EE)) / (magic * sqrtMagic) * _CRS_PI),
      lon: (dLon * 180.0) / (_CRS_A / sqrtMagic * Math.cos(radLat) * _CRS_PI),
    };
  }
  function gcj02ToWgs84(coord) {
    const lon = coord[0], lat = coord[1];
    if (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271) return [lon, lat];
    const d = _crsDelta(lat, lon);
    return [lon - d.lon, lat - d.lat];
  }

  const map = new Map("map", {
    center: [94.50602824, 29.36774605, 3881],
    pitch: 44.1,
    bearing: 165.7,
    zoom: 12.8,
  });

  const token =
    "pk.eyJ1IjoiemhlbmZ1IiwiYSI6ImNsaTduNXM4ZjBtZnczbG1wbmNjenQ0OW8ifQ.UOkJDZYcC1zs9cXny6P8YQ";

  const targetCoord = new Coordinate(0, 0);
  const POINT0 = new Coordinate(0, 0);
  const POINT1 = new Coordinate(0, 0);

  const layers = [
    new TileLayer("base", {
      maxAvailableZoom: 20,
      spatialReference: {
        projection: "EPSG:3857",
      },
      urlTemplate:
        "http://webst{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}",
      subdomains: ["01", "02", "03", "04"],
      offset: function (z) {
        const center = map.getCenter();
        const c = gcj02ToWgs84(center.toArray());
        targetCoord.set(c[0], c[1]);
        const offset = map
          .coordToPoint(center, z, POINT0)
          ._sub(map.coordToPoint(targetCoord, z, POINT1));
        return offset._round().toArray();
      },
      attribution:
        '&copy; <a href="http://osm.org">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/">CARTO</a>',
    }),
  ];

  const terrain = {
    type: "mapbox",
    tileSize: 256,
    urlTemplate: `https://{s}.tiles.mapbox.com/v4/mapbox.terrain-rgb/{z}/{x}/{y}.pngraw?access_token=${token}`,
    subdomains: ["a", "b", "c", "d"],
  };

  const lines = {
    type: "FeatureCollection",
    features: [
      {
        type: "Feature",
        geometry: {
          type: "LineString",
          coordinates: [
            [94.49872762429698, 29.419687853431952],
            [94.5017517325524, 29.41411114734828],
            [94.50278326399507, 29.40847932148145],
            [94.51319164855079, 29.405419569184318],
            [94.51929207097919, 29.39401914977836],
            [94.50668658457573, 29.382753862567796],
            [94.50593725736212, 29.3705326550988],
            [94.50093967073644, 29.35613686039855],
          ],
        },
      },
    ],
  };

  const lineStyle = [
    {
      filter: true,
      renderPlugin: {
        dataConfig: {
          awareOfTerrain: true,
          type: "line",
        },
        sceneConfig: {},
        type: "line",
      },
      symbol: {
        lineColor: "#ea6b48",
        lineWidth: 4,
      },
    },
  ];

  const vtLineLayer = new GeoJSONVectorTileLayer("vt-line", {
    data: lines,
    style: lineStyle,
  });

  layers.push(vtLineLayer);

  const points = {
    type: "Feature",
    properties: {},
    geometry: {
      type: "MultiPoint",
      coordinates: [
        [94.49872762429698, 29.419687853431952],
        [94.50093967073644, 29.35613686039855],
      ],
    },
  };

  const pointStyle = [
    {
      filter: true,
      renderPlugin: {
        dataConfig: {
          awareOfTerrain: true,
          type: "point",
        },
        sceneConfig: { collision: true },
        type: "icon",
      },
      symbol: {
        markerFile: "{res}/markers/site.svg",
        markerWidth: 24,
        markerHeight: 26,
      },
    },
  ];

  const vtPointLayer = new GeoJSONVectorTileLayer("vt-point", {
    data: points,
    style: pointStyle,
  });

  layers.push(vtPointLayer);

  const group = new GroupGLLayer("group", layers, {
    terrain,
  });
  group.addTo(map);

  function setTerrain(value) {
    if (value) {
      group.setTerrain(terrain);
    } else {
      group.setTerrain(null);
    }
  }
</script>

<div id="map" class="container">loading data...</div>
<script src="https://d3js.org/d3.v4.min.js"></script>
<script src="https://d3js.org/topojson.v2.min.js"></script>

<script type="module">
  import * as maptalks from "maptalks";
  import d3 from "d3v4";
  window.d3 = d3;
  import * as topojson from "topojson-client";
  window.topojson = topojson;

  // Versor Dragging projection from D3
  // https://bl.ocks.org/mbostock/7ea1dde508cec6d2d95306f92642bc42
  const projection = d3.geoOrthographic().scale(148).precision(0.1);

  // convert to a maptalks projection object
  const proj = {
    project: function (c) {
      const pc = projection([c.x, c.y]);
      // orthographic 投影对背面/极点可能返回 null，兜底返回原坐标，避免 null[0] 崩溃
      if (!pc || isNaN(pc[0]) || isNaN(pc[1])) {
        return new maptalks.Coordinate(c.x, c.y);
      }
      return new maptalks.Coordinate(pc[0], pc[1]);
    },
    unproject: function (pc) {
      const c = projection.invert([pc.x, pc.y]);
      if (!c || isNaN(c[0]) || isNaN(c[1])) {
        return null;
      }
      return new maptalks.Coordinate(c);
    },
  };

  const min = proj.project(new maptalks.Coordinate(-180, -90)),
    max = proj.project(new maptalks.Coordinate(180, 90)),
    fullExtent = {
      top: max.y,
      left: min.x,
      right: max.x,
      bottom: min.y,
    };

  // REPL iframe 里 d3 v4 的 d3.json（XHR）会报错，改用 fetch 加载 GeoJSON
  fetch("{res}/geojson/world-50m.json")
    .then(function (res) {
      return res.json();
    })
    .then(function (world) {
      // initialize map with a customized projection
      const map = new maptalks.Map("map", {
        center: [0, 0],
        centerCross: true,
        zoom: 2,
        spatialReference: {
          projection: proj,
          resolutions: (function () {
            const resolutions = [];
            for (let i = 0; i < 10; i++) {
              resolutions[i] = 4 / Math.pow(2, i);
            }
            return resolutions;
          })(),
          fullExtent: fullExtent,
        },
      });
      const featureCollection = topojson.feature(world, world.objects.countries),
        geometries = maptalks.GeoJSON.toGeometry(featureCollection);
      const symbol = {
        lineColor: "#fff",
        lineWidth: 0.5,
        polygonOpacity: 1,
        polygonFill: "#747474",
      };
      new maptalks.VectorLayer("v", geometries, {
        geometryEvents: false,
        enableSimplify: false,
      })
        .forEach(function (geo) {
          geo.setSymbol(symbol);
        })
        .addTo(map);
    })
    .catch(function (err) {
      throw err;
    });
</script>

<style>
  @import "https://maptalks.com/api/maptalks.css";
  @import "./index.css";
</style>
